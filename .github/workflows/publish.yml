name: Publish tested images

on:
  workflow_call:

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  push:
    name: Push tested image / ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/tested-image
      - name: Normalize the registry path
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the exact image that passed CI
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker load --input "$RUNNER_TEMP/tested-image/image-$ARCH.tar.gz"
          target="$IMAGE:sha-$GITHUB_SHA-$ARCH"
          docker tag "spoticonn:ci-$ARCH" "$target"
          docker push "$target"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$target")
          digest=${reference##*@}
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$digest" > "$RUNNER_TEMP/digests/$ARCH.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 3

  manifest:
    name: Publish multi-platform tags
    needs: push
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Normalize the registry path
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute multi-platform tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Assemble and verify both platforms
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$META_JSON")
          ((${#tags[@]} > 0))
          tag_args=()
          for tag in "${tags[@]}"; do tag_args+=(--tag "$tag"); done
          references=()
          for arch in amd64 arm64; do
            digest=$(cat "$RUNNER_TEMP/digests/$arch.txt")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            references+=("$IMAGE@$digest")
          done
          docker buildx imagetools create "${tag_args[@]}" "${references[@]}"
          docker buildx imagetools inspect --raw "${tags[0]}" > "$RUNNER_TEMP/manifest.json"
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' "$RUNNER_TEMP/manifest.json"
          {
            echo '### Published multi-platform image'
            printf -- '- %s\n' "${tags[@]}"
            echo
            docker buildx imagetools inspect "${tags[0]}"
          } >> "$GITHUB_STEP_SUMMARY"
